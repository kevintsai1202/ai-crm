server:
  port: 18080

logging:
  level:
    org.springframework.web.client.RestClient: DEBUG
    org.springframework.web.reactive.function.client.WebClient: DEBUG
    org.springframework.ai: DEBUG
    com.aicrm.crm.service.embedding.VoyageEmbeddingClient: DEBUG

spring:
  application:
    name: ai-crm-backend
  # 匯入專案根目錄的 .env 作為設定來源（OPENAI_API_KEY、MODEL 等）。
  # optional 表示檔案不存在也不報錯；[.properties] 提示以 KEY=VALUE 格式解析。
  # 同時嘗試 backend 工作目錄與其上層（repo 根），相容不同啟動位置。
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://127.0.0.1:15432/aicrm
    username: aicrm
    password: aicrm
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # 批次載入 LAZY 關聯：存取一個集合時，順帶以 IN 子句一次撈回最多 N 個實體的同關聯，
        # 把儀表板聚合「每客戶逐筆載入互動/商機」的 N+1（數百條查詢）收斂成個位數查詢。
        default_batch_fetch_size: 100
  web:
    cors:
      allowed-origins: http://127.0.0.1:*,http://localhost:*
  # Spring AI OpenAI 設定：api-key 取自 .env / 環境變數 OPENAI_API_KEY，未設定時為空字串，
  # 此時 InsightService 以金鑰是否設定判斷，未設定則 fallback 至 deterministic 流程。
  # model 取自 .env / 環境變數 OPENAI_CHAT_MODEL，未設定時預設 gpt-4o-mini。
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      # base-url 取自 .env 的 BASE_URL，可指向 OpenAI 相容的第三方閘道（如 Zeabur AI Hub）。
      # Spring AI 2.0 的 calculateBaseUrl 邏輯：若 base-url 非空則直接使用（不自動加 /v1）；
      # 若為空才 fallback 至預設 "https://api.openai.com/v1"。
      # 因此必須明確帶 /v1，否則 SDK 會打 https://api.openai.com/chat/completions → 404。
      # BASE_URL 環境變數（如 Zeabur AI Hub）應已含 /v1（如 https://hnd1.aihub.zeabur.ai/v1）。
      base-url: ${BASE_URL:https://api.openai.com/v1}
      chat:
        model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
        temperature: 0.3
        options:
          # GPT-5.4+ 已廢棄 max_tokens，改用 max_completion_tokens；
          # 明確設 max-tokens 為空、max-completion-tokens 有值，避免 Spring AI 預設帶 max_tokens 導致 400。
          max-tokens:
          max-completion-tokens: ${OPENAI_MAX_COMPLETION_TOKENS:2000}

app:
  security:
    # JWT 簽章密鑰：務必以環境變數 APP_SECURITY_JWT_SECRET 提供高強度隨機值（≥32 bytes）。
    # 預設留空，啟動時由 JwtService 做 fail-fast 檢查，杜絕使用公開預設值（避免認證繞過）。
    jwt-secret: ${APP_SECURITY_JWT_SECRET:}
    token-ttl-seconds: 28800
  # Voyage 向量嵌入設定：api-key 取自 .env / 環境變數 VOYAGE_API_KEY，未設定時為空字串，
  # 此時 VoyageEmbeddingClient 走 deterministic fallback。model/url/dimension 對應 Voyage embeddings API。
  voyage:
    api-key: ${VOYAGE_API_KEY:}
    model: ${VOYAGE_MODEL:voyage-4-lite}
    url: ${VOYAGE_URL:https://api.voyageai.com/v1/embeddings}
    dimension: 1024
  # 風險等級每日重算排程：預設啟用；風險等級依賴當天日期，不每日更新會失準。
  # 以環境變數 APP_RISK_DAILY_RECOMPUTE_ENABLED=false 可關閉。
  risk:
    daily-recompute:
      enabled: ${APP_RISK_DAILY_RECOMPUTE_ENABLED:true}
  # 示範資料「清除重建」開關：本專案部署皆為「示範環境」，預設啟用（true）。
  # /api/dev/generate-demo-data 為 ADMIN 限定的示範資料端點；若改作真實正式環境，
  # 務必以環境變數 DEMO_RESET_ENABLED=false 關閉，避免誤刪真實業務資料。
  demo:
    reset-enabled: ${DEMO_RESET_ENABLED:true}
  # 模型測試的 max_completion_tokens 上限。推理型模型（gpt-5-mini 等）會先花大量 token 在內部
  # reasoning，上限太低（如 2000）會在輸出可見內容前就截斷成空回應；預設 8000，可以
  # MODEL_TEST_MAX_COMPLETION_TOKENS 調整。
  ai:
    model-test:
      max-completion-tokens: ${MODEL_TEST_MAX_COMPLETION_TOKENS:8000}

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:file:./data/ai-crm;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  flyway:
    # pgvector extension（V5 migration）在 H2 不支援，停用 Flyway 改由 Hibernate DDL 建表
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true
