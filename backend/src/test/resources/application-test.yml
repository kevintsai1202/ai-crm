# SP3 測試 profile：DB 由 Testcontainers Postgres(@ServiceConnection) 注入；空金鑰強制 fallback
spring:
  main:
    # 允許測試以同名 bean 覆寫（RagRelevanceTest 用 fake EmbeddingClient 覆寫 voyageEmbeddingClient）
    allow-bean-definition-overriding: true
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
  ai:
    openai:
      api-key: ""
app:
  security:
    # 測試用 JWT 密鑰（≥32 字元）：避免 JwtService fail-fast 導致整合測試 context 載入失敗。
    # 正式環境一律由環境變數 APP_SECURITY_JWT_SECRET 提供，切勿沿用此測試值。
    jwt-secret: "test-only-jwt-secret-please-change-1234567890abcd"
  voyage:
    api-key: ""
