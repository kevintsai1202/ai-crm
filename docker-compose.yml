services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-crm-postgres
    environment:
      POSTGRES_DB: aicrm
      POSTGRES_USER: aicrm
      POSTGRES_PASSWORD: aicrm
    ports:
      - "15432:5432"
    volumes:
      - ai-crm-postgres-data:/var/lib/postgresql
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: ai-crm-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MEDIA_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MEDIA_S3_SECRET_KEY:-minioadmin}
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - ai-crm-minio-data:/data

volumes:
  ai-crm-postgres-data:
  ai-crm-minio-data:
