services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-crm-postgres
    environment:
      POSTGRES_DB: aicrm
      POSTGRES_USER: aicrm
      POSTGRES_PASSWORD: aicrm
    ports:
      - "15432:5432"
    volumes:
      - ai-crm-postgres-data:/var/lib/postgresql

volumes:
  ai-crm-postgres-data:
