services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-crm-postgres
    environment:
      POSTGRES_DB: aicrm
      POSTGRES_USER: aicrm
      POSTGRES_PASSWORD: aicrm
    ports:
      - "15432:5432"
    volumes:
      - ai-crm-postgres-data:/var/lib/postgresql
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: ai-crm-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - ai-crm-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  ai-crm-postgres-data:
  ai-crm-minio-data:
